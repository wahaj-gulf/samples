<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beauty Trends | احجزي موعدك</title>
<style>@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Play';font-style:italic;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/playfair-display@5.3.0/files/playfair-display-latin-700-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
.hf{font-family:"Play","Cairo",serif}
:root{--pe:#fedfc3;--te:#8a3f2a;--cr:#fff8f1;--ink:#3b2218;--rs:#f2b9a0}
*{box-sizing:border-box;margin:0}body{font-family:"Cairo",Tahoma,system-ui,Arial,sans-serif;background:var(--cr);color:var(--ink);line-height:1.6}
.hd{max-width:480px;margin:0 auto;padding:30px 20px 10px}.hd small{letter-spacing:.3em;color:var(--te);font-size:11px}.hd h1{font-size:44px;line-height:1.05;color:var(--te);font-weight:400;font-style:italic;margin:6px 0 8px}.hd p{font-size:15px;opacity:.75}
.pill{display:inline-block;background:var(--pe);border-radius:999px;padding:6px 14px;font-size:12px;margin-top:10px;color:var(--te)}
.st{max-width:480px;margin:18px auto 0;padding:0 20px;display:flex;gap:6px}.st i{flex:1;height:4px;border-radius:4px;background:#ecd2bc}.st i.on{background:var(--te)}
.w{max-width:480px;margin:0 auto;padding:10px 20px 170px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.tabs button{flex:none;border:0;background:var(--pe);color:var(--te);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer}.tabs button.on{background:var(--te);color:#fff}
.it{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #f0dccb;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:var(--ink);text-align:right}
.it .no{font-size:22px;color:var(--rs);width:34px;font-style:italic}.it div{flex:1}.it b{font-size:16px;font-weight:600}.it span{display:block;font-size:12px;opacity:.6}
.pl{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--te);color:var(--te);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}.it.on .pl{background:var(--te);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 18px}.cal button{border:1.5px solid #ecd2bc;background:#fff;border-radius:12px;padding:8px 0;font:inherit;cursor:pointer;color:var(--ink)}.cal small{display:block;font-size:9px;opacity:.6}.cal button.on{background:var(--te);color:#fff;border-color:var(--te)}
.hrs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hrs button{border:1.5px solid #ecd2bc;background:#fff;border-radius:12px;padding:12px 0;font:inherit;cursor:pointer;color:var(--ink)}.hrs button.on{background:var(--rs);border-color:var(--rs);font-weight:700}
h3{font-size:14px;color:var(--te);margin:16px 0 8px}
input{width:100%;padding:14px;border:1.5px solid #ecd2bc;border-radius:14px;font:inherit;font-size:16px;background:#fff;margin-bottom:10px}
.err{color:#b3261e;font-size:13px;display:none}.note{text-align:center;font-size:12px;opacity:.6;margin-top:16px}
.dock{position:fixed;bottom:0;left:0;right:0;background:var(--te);color:#fff;border-radius:22px 22px 0 0;padding:14px 18px 20px}
.dock div{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.dock span{font-size:13px;opacity:.9}.dock button{border:0;background:var(--pe);color:var(--te);border-radius:14px;padding:13px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.ok{display:none;max-width:480px;margin:0 auto;padding:50px 24px;text-align:center}.ok h1{font-size:40px;color:var(--te);font-weight:400;font-style:italic}.crd{background:var(--pe);border-radius:24px;padding:20px;margin-top:20px;text-align:right;line-height:2}
.hd h1,.ok h1{font-family:"Play","Cairo",serif;font-weight:700;font-size:46px}</style></head><body>
<div class="hd"><small>BEAUTY TRENDS</small><h1>Beauty<br>Trends</h1><p>اختاري خدماتك وموعدك بدقيقة، بدون اتصال</p><span class="pill">حجز أونلاين</span></div>
<div class="st"><i class="on" id="s1"></i><i id="s2"></i><i id="s3"></i></div>
<main class="w" id="a"><div class="tabs" id="tb"></div><div id="ls"></div></main>
<main class="w" id="b" style="display:none"><h3>اليوم</h3><div class="cal" id="cl"></div><h3>الوقت</h3><div class="hrs" id="hr"></div><h3>بياناتك</h3><input id="n" placeholder="الاسم"><input id="p" inputmode="tel" placeholder="رقم الواتساب"><div class="err" id="e"></div><p class="note">عينة توضيحية من فريق وهج بهوية Beauty Trends. الخدمات والأوقات أمثلة، ولا يتم إرسال أي بيانات.</p></main>
<div class="ok" id="ok"><h1>Thank you</h1><p>هذا مثال لتأكيد الحجز اللي تشوفه عميلتك</p><div class="crd" id="sm"></div><p class="note">عينة توضيحية من فريق وهج</p></div>
<div class="dock" id="dk"><div><span id="ct">لم تختاري خدمة بعد</span><button id="go">التالي</button></div></div>
<script>
var $=function(i){return document.getElementById(i)},C={"الشعر":["قص وتصفيف","صبغة كاملة","هايلايت","بروتين وعلاج","سشوار"],"المكياج":["مكياج سهرة","مكياج عروس","مكياج يومي","رموش"],"الأظافر":["مناكير","بديكير","جل","أكريليك"],"البشرة":["تنظيف بشرة","تقشير","ماسك علاجي","شمع وإزالة شعر"]},cat="الشعر",ch={},step=1,dn=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"],dy=0,hr="11:00 ص";
function tabs(){$("tb").innerHTML=Object.keys(C).map(function(k){return"<button class='"+(k==cat?"on":"")+"'>"+k+"</button>"}).join("");list()}
function list(){$("ls").innerHTML=C[cat].map(function(x,i){var id=cat+i;return"<button class='it"+(ch[id]?" on":"")+"' data-id='"+id+"' data-n='"+x+"'><span class='no'>"+(i+1)+"</span><div><b>"+x+"</b><span>السعر حسب قائمتكم</span></div><span class='pl'>"+(ch[id]?"&#10003;":"+")+"</span></button>"}).join("")}
$("tb").onclick=function(e){var b=e.target.closest("button");if(!b)return;cat=b.textContent;tabs()};
$("ls").onclick=function(e){var b=e.target.closest(".it");if(!b)return;var id=b.dataset.id;if(ch[id])delete ch[id];else ch[id]=b.dataset.n;list();var n=Object.keys(ch).length;$("ct").textContent=n?n+" خدمات مختارة":"لم تختاري خدمة بعد"};
var DD=[];for(var i=1;i<=7;i++){var t=new Date(Date.now()+i*864e5);DD.push([dn[t.getDay()],t.getDate(),t.getDate()+"/"+(t.getMonth()+1)])}
$("cl").innerHTML=DD.map(function(d,i){return"<button class='"+(i?"":"on")+"' data-i='"+i+"'><small>"+d[0]+"</small><b>"+d[1]+"</b></button>"}).join("");
var H=["10:00 ص","11:00 ص","12:30 م","2:00 م","4:00 م","5:30 م"];$("hr").innerHTML=H.map(function(x){return"<button class='"+(x==hr?"on":"")+"'>"+x+"</button>"}).join("");
$("cl").onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($("cl").children,function(c){c.classList.remove("on")});b.classList.add("on");dy=+b.dataset.i};
$("hr").onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($("hr").children,function(c){c.classList.remove("on")});b.classList.add("on");hr=b.textContent};
$("go").onclick=function(){var er=$("e");if(step==1){if(!Object.keys(ch).length){$("ct").textContent="اختاري خدمة وحدة على الأقل";return}step=2;$("a").style.display="none";$("b").style.display="block";$("s2").className="on";$("go").textContent="أكّدي الحجز";window.scrollTo(0,0);return}
var n=$("n").value.trim(),p=$("p").value.replace(/\D/g,"");er.style.display="none";if(n.length<2){er.textContent="اكتبي اسمك";er.style.display="block";return}if(p.length<8){er.textContent="رقم الواتساب غير مكتمل";er.style.display="block";return}
$("sm").innerHTML=Object.keys(ch).map(function(k){return ch[k]}).join(" + ")+"<br>"+DD[dy][0]+" "+DD[dy][2]+" · "+hr+"<br>الاسم: "+n.replace(/</g,"");$("b").style.display="none";$("dk").style.display="none";document.querySelector(".hd").style.display="none";document.querySelector(".st").style.display="none";$("ok").style.display="block"};
tabs();
</script></body></html>
