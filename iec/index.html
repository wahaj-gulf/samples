sess(){return `<div class="cd"><h3>الجلسات المباشرة <button class="btn s" onclick="toast('تمت جدولة جلسة جديدة وإرسال الدعوات ✅')">+ جدولة جلسة</button></h3><table><tr><th>الجلسة</th><th>الموعد</th><th>المسجّلون</th><th></th></tr><tr><td>الإدارة المالية والمصرفية</td><td>اليوم 7:00 م</td><td>18</td><td><button class="btn g s" onclick="toast('جاري فتح غرفة الجلسة...')">بدء الجلسة</button></td></tr><tr><td>القيادة الإدارية الحديثة</td><td>24 نوفمبر 7:00 م</td><td>22</td><td></td></tr></table></div>`},
adash(){const a=D.inv.reduce((s,i)=>s+i.amt,0),p=D.inv.reduce((s,i)=>s+i.paid,0);return `<div class="kp"><div class="k"><div><small>الطلاب والمتدربون</small><b>${D.students.length}</b></div><i>👥</i></div><div class="k"><div><small>طلبات القبول النشطة</small><b>${D.students.filter(s=>s.uni!='—').length}</b></div><i>🎓</i></div><div class="k"><div><small>المحصّل</small><b style="color:var(--ok)">${omr(p)}</b></div><i>💰</i></div><div class="k"><div><small>المتأخرات</small><b style="color:var(--bad)">${omr(a-p)}</b></div><i style="background:#fde8e8">⚠️</i></div></div>
<div class="g2"><div class="cd"><h3>نسبة التحصيل</h3><div class="bar"><i style="width:${Math.round(p/a*100)}%"></i></div><p>${Math.round(p/a*100)}% من إجمالي ${omr(a)}</p></div><div class="cd"><h3>تنبيهات</h3><ul class="ls"><li>📄 مستند مرفوض بانتظار إعادة الرفع (ريم جلال)</li><li>💳 ${D.inv.filter(i=>i.paid<i.amt).length} فواتير غير مكتملة</li><li>📉 ${D.students.filter(s=>s.att<80).length} متدرب حضوره أقل من 80%</li></ul></div></div>
<div class="cd"><h3>آخر الفواتير <button class="btn s" onclick="portal('bill')">عرض الكل</button></h3><table>${IH()}${invRows(D.inv.slice(-3))}</table></div>`},
astu(){return `<div class="cd"><h3>الطلاب والمتدربون <button class="btn s" onclick="om(stuForm())">+ إضافة طالب</button></h3><table><tr><th>الرقم</th><th>الاسم</th><th>البرنامج</th><th>ولي الأمر</th><th>الحضور</th></tr>${D.students.map(s=>`<tr><td>${s.no}</td><td>${s.name}</td><td>${s.prog}</td><td>${s.parent}</td><td><span class="tg ${s.att>=90?'ok':s.att>=80?'wn':'bd'}">${s.att}%</span></td></tr>`).join('')}</table></div>`},
aapp(){return `<div class="cd"><h3>طلبات القبول الجامعي</h3><table><tr><th>الرقم</th><th>الطالب</th><th>الجامعة</th><th>المرحلة</th><th>تحديث</th></tr>${D.students.filter(s=>s.uni!='—').map(s=>`<tr><td>${s.no}</td><td>${s.name}</td><td>${s.uni}</td><td><span class="tg nf">${D.steps[s.stage]}</span></td><td><select style="width:auto" onchange="stu(${s.id}).stage=+this.value;toast('تم تحديث المرحلة وإشعار الطالب وولي الأمر ✅');portal()">${D.steps.map((x,i)=>`<option value="${i}" ${i==s.stage?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`},
bill(){return `<div class="cd"><h3>الفوترة والأقساط <button class="btn s" onclick="om(invForm())">+ فاتورة جديدة</button></h3><table>${IH()}${invRows(D.inv)}</table></div>`},
acrs(){return `<div class="cd"><h3>البرامج التدريبية <button class="btn s" onclick="toast('تمت إضافة برنامج جديد ✅')">+ برنامج جديد</button></h3><table><tr><th>البرنامج</th><th>النمط</th><th>المسجّلون</th><th>السعر</th></tr><tr><td>الصحة والسلامة المهنية – النفط والغاز</td><td>حضوري + أونلاين</td><td>38/50</td><td>120 ر.ع</td></tr>${D.courses.map((c,i)=>`<tr><td>${c.n}</td><td>${c.m}</td><td>${12+i*5}</td><td>${150+i*30} ر.ع</td></tr>`).join('')}</table></div>`},
rep(){const g={};D.students.forEach(s=>{const k=s.uni=='—'?'التدريب':'القبول الجامعي';g[k]=(g[k]||0)+1});return `<div class="g2"><div class="cd"><h3>التوزيع حسب الخدمة</h3>${Object.entries(g).map(([k,v])=>`<p>${k} (${v})</p><div class="bar"><i style="width:${v/D.students.length*100}%"></i></div>`).join('')}</div><div class="cd"><h3>الحضور</h3>${D.students.map(s=>`<p>${s.name} – ${s.att}%</p><div class="bar"><i style="width:${s.att}%;background:${s.att<80?'var(--bad)':'var(--ok)'}"></i></div>`).join('')}</div></div><button class="btn g" onclick="toast('تم تجهيز التقرير بصيغة PDF و Excel ✅')">تصدير التقارير</button>`},
audit(){return `<div class="cd"><h3>سجل الأمان والعمليات 🛡️</h3><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr><tr><td>اليوم 10:42</td><td>admin</td><td>تسجيل دخول ناجح (تحقق بخطوتين)</td></tr><tr><td>اليوم 10:15</td><td>IEC-2026-00427</td><td>رفع مستند: السيرة الذاتية</td></tr><tr><td>أمس 21:03</td><td>غير معروف</td><td><span class="tg bd">5 محاولات دخول فاشلة – تم الحظر المؤقت</span></td></tr><tr><td>أمس 14:20</td><td>المالية</td><td>تسجيل دفعة INV-2043</td></tr></table><p style="color:var(--mut);font-size:13px">🔒 كلمات المرور مشفّرة بتقنية bcrypt · البيانات مشفّرة AES-256 · الاتصال عبر HTTPS · نسخ احتياطي يومي</p></div>`}};
function cert(i){om(`<div class="rcp" style="text-align:center"><h2 style="color:var(--gd)">شهادة إتمام</h2><p>يشهد معهد التميز والإبداع بأن</p><h3>${S.name}</h3><p>أتمّ بنجاح دورة</p><h3>${D.certs[i]}</h3></div><br><button class="btn o" onclick="cm()">إغلاق</button>`)}
function chpw(){const v=$('p2').value;if($('p1').value!==S.pw){$('pe').textContent='كلمة المرور الحالية غير صحيحة';return}if(!/^(?=.*[A-Z])(?=.*\d)(?=.*\W).{8,}$/.test(v)){$('pe').textContent='كلمة المرور ضعيفة';return}S.pw=v;$('pe').textContent='';toast('تم تغيير كلمة المرور ✅')}
function pay(no){const i=D.inv.find(x=>x.no==no),r=i.amt-i.paid;om(`<h3>${S.role=='admin'?'تسجيل دفعة':'الدفع الإلكتروني الآمن 🔒'}</h3><p>${i.item}<br>المتبقي: <b>${omr(r)}</b></p><label>المبلغ</label><input id="pv" type="number" value="${r}"><label>طريقة الدفع</label><select><option>بطاقة بنكية</option><option>تحويل بنكي</option>${S.role=='admin'?'<option>نقداً</option>':''}</select><br><br><button class="btn" onclick="doPay('${no}')">تأكيد الدفع</button> <button class="btn o" onclick="cm()">إلغاء</button>`)}
function doPay(no){const i=D.inv.find(x=>x.no==no),v=Math.max(0,+$('pv').value||0);i.paid=Math.min(i.amt,i.paid+v);cm();toast('تم الدفع وإرسال الإيصال ✅');portal()}
function rcpt(no){const i=D.inv.find(x=>x.no==no);om(`<div class="rcp"><div class="logo"><div class="m">IEC</div><div><b>إيصال سداد</b><small>معهد التميز والإبداع</small></div></div><p style="line-height:2">رقم الفاتورة: ${no}<br>الطالب: ${stu(i.sid).name}<br>البند: ${i.item}<br>المبلغ المدفوع: <b>${omr(i.paid)}</b><br>الحالة: <span class="tg ok">مدفوعة</span></p></div><br><button class="btn o" onclick="cm()">إغلاق</button>`)}
function invForm(){return `<h3>فاتورة جديدة</h3><label>الطالب</label><select id="ns">${D.students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><label>البند</label><input id="ni" value="رسوم برنامج تدريبي"><label>المبلغ (ر.ع)</label><input id="na" type="number" value="150"><label>تاريخ الاستحقاق</label><input id="nd" type="date" value="2026-12-15"><br><br><button class="btn" onclick="D.inv.push({no:'INV-'+(2041+D.inv.length),sid:+$('ns').value,item:$('ni').value,amt:+$('na').value||0,paid:0,due:$('nd').value});cm();toast('تم إصدار الفاتورة وإرسالها للطالب وولي الأمر ✅');portal()">إصدار وإرسال</button> <button class="btn o" onclick="cm()">إلغاء</button>`}
function stuForm(){return `<h3>إضافة طالب</h3><label>الاسم</label><input id="sn"><label>البرنامج</label><input id="sp" value="القبول الجامعي"><label>ولي الأمر</label><input id="sa"><br><br><button class="btn" onclick="addStu()">إضافة وإنشاء حساب</button> <button class="btn o" onclick="cm()">إلغاء</button>`}
function addStu(){const n=$('sn').value.trim();if(!n)return;const id=D.students.length+1,no='IEC-2026-00'+(440+id),pw='Iec@'+Math.floor(1000+Math.random()*9000);D.students.push({id,no,name:n,prog:$('sp').value,uni:'—',stage:0,att:100,parent:$('sa').value||'—'});D.users[no]={pw,role:'student',name:n,sid:id};om(`<h3>تم إنشاء الحساب ✅</h3><p>الرقم الأكاديمي: <b>${no}</b><br>كلمة مرور مؤقتة: <b>${pw}</b></p><p style="color:var(--mut);font-size:13px">يُطلب من الطالب تغييرها عند أول دخول.</p><button class="btn" onclick="cm();portal()">تم</button>`)}
function apptForm(){return `<h3>حجز موعد</h3><label>نوع الموعد</label><select id="at"><option>استشارة أكاديمية</option><option>مراجعة المستندات</option><option>استشارة تدريبية</option></select><label>التاريخ</label><input id="ad" type="date" value="2026-11-26"><br><br><button class="btn" onclick="D.appts.push([$('ad').value,'11:00 ص',$('at').value,'حضوري – مقر المعهد']);cm();toast('تم حجز الموعد ✅');portal()">تأكيد الحجز</button> <button class="btn o" onclick="cm()">إلغاء</button>`}
function msgForm(){return `<h3>رسالة جديدة</h3><label>إلى</label><select><option>قسم القبول</option><option>المالية</option><option>المدرب</option>${S.role=='admin'?'<option>كل الطلاب</option><option>كل أولياء الأمور</option>':''}</select><label>الرسالة</label><textarea id="mt" rows="4"></textarea><br><br><button class="btn" onclick="D.msgs.unshift({f:S.name,t:$('mt').value||'رسالة',d:'الآن'});cm();toast('تم الإرسال ✅');portal()">إرسال</button> <button class="btn o" onclick="cm()">إلغاء</button>`}
home();
</script></body></html>
