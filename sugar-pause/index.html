<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sugar Pause | اطلب</title>
<style>@font-face{font-family:'Cairo';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Cairo';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Ami';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/amiri@5.3.0/files/amiri-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Ami';font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/amiri@5.3.0/files/amiri-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--g:#354d23;--g2:#587a3d;--sg:#aacc90;--cr:#f7f4e8;--tx:#27331c;--pk:#f2c9b8}
*{box-sizing:border-box;margin:0}body{font-family:"Cairo",Tahoma,sans-serif;background:var(--cr);color:var(--tx);line-height:1.6}
.top{background:var(--g);color:#fff;padding:26px 20px 56px;text-align:center;border-radius:0 0 50% 50%/0 0 28px 28px}
.top h1{font-family:"Ami","Cairo",serif;font-weight:700;font-size:38px;line-height:1.1}.top small{display:block;letter-spacing:.35em;font-size:11px;color:var(--sg);margin-bottom:6px}.top p{opacity:.9;margin-top:4px}
.sw{max-width:480px;margin:-26px auto 0;padding:0 14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}.tab{flex:0 0 auto;border:0;background:#fff;color:var(--g);font:inherit;font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 2px 8px #0001;cursor:pointer}.tab.on{background:var(--g2);color:#fff}
.it{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px #3b4a2a14}
.th{flex:0 0 66px;height:66px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px}
.it b{display:block;font-size:15.5px}.it span{font-size:12px;opacity:.65}.pr{font-weight:700;color:var(--g2);font-size:14px}
.qt{margin-right:auto;display:flex;align-items:center;gap:10px}.qt button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sg);color:var(--g);font-size:20px;font-weight:700;cursor:pointer;line-height:1}.qt .m{background:#eceee2}.qt i{font-style:normal;font-weight:700;min-width:14px;text-align:center}
.cart{position:fixed;left:12px;right:12px;bottom:14px;max-width:456px;margin:0 auto;background:var(--g);color:#fff;border:0;border-radius:22px;padding:16px 20px;font:inherit;font-weight:700;font-size:16px;display:none;justify-content:space-between;cursor:pointer;box-shadow:0 10px 30px #26361a66}
.sh{display:none;max-width:480px;margin:0 auto;padding:26px 18px 40px}.sh h2{font-family:"Ami","Cairo",serif;font-size:28px;color:var(--g);margin-bottom:12px}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #c8d1b6}.tot{font-weight:700;font-size:18px;padding:14px 0}
.md{display:flex;gap:8px;margin:12px 0}.md button{flex:1;padding:12px;border-radius:14px;border:2px solid #d4dcc4;background:#fff;font:inherit;font-weight:700;color:var(--g);cursor:pointer}.md .on{border-color:var(--g2);background:#eef5e6}
input{width:100%;padding:14px;border:2px solid #d4dcc4;border-radius:14px;font:inherit;font-size:16px;background:#fff;margin-bottom:10px}
.go{display:block;width:100%;border:0;background:var(--g2);color:#fff;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin-top:6px}
.err{color:#b3261e;font-size:13px;display:none}.note{text-align:center;font-size:12px;opacity:.6;margin-top:14px}
.ok{display:none;text-align:center;max-width:480px;margin:0 auto;padding:60px 20px}.ok .ck{width:84px;height:84px;border-radius:50%;background:var(--sg);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;color:var(--g)}
.ok h3{font-family:"Ami","Cairo",serif;font-size:30px;color:var(--g)}.tk{margin:18px 0;background:#fff;border-radius:20px;padding:16px;text-align:right;border-top:6px solid var(--g2);line-height:1.9}
</style></head><body>
<div id="m"><header class="top"><small>SUGAR PAUSE</small><h1>Sugar Pause</h1><p>اطلب حلاك المفضل بدون ما تنتظر</p></header>
<div class="sw"><div class="tabs" id="tb"></div><div id="ls"></div></div></div>
<button class="cart" id="ct"><span id="cc"></span><span id="cp"></span></button>
<section class="sh" id="ck"><h2>مراجعة الطلب</h2><div id="cl"></div><div class="ln tot"><span>الإجمالي (مثال)</span><span id="tt"></span></div>
<div class="md" id="md"><button class="on">استلام من الفرع</button><button>توصيل</button></div>
<input id="n" placeholder="الاسم"><input id="p" inputmode="tel" placeholder="رقم الواتساب"><div class="err" id="e"></div><button class="go" id="go">تأكيد الطلب</button>
<p class="note">عينة توضيحية من فريق وهج بهوية Sugar Pause. الأصناف والأسعار أمثلة، ولا يتم إرسال أي بيانات.</p></section>
<div class="ok" id="ok"><div class="ck">&#10003;</div><h3>وصلنا طلبك</h3><p>هذا مثال لما يشوفه عميلك بعد الطلب</p><div class="tk" id="tk"></div><p class="note">عينة توضيحية من فريق وهج</p></div>
<script>
var C=[["كيك","#f2c9b8",[["تشيز كيك الفراولة","شريحة طازجة",1.8],["كيك الشوكولاتة","طبقات غنية",1.6],["كب كيك فانيلا","مع كريمة",0.9]]],["حلويات","#f5e3a8",[["تيراميسو","بالقهوة",1.7],["وافل بالنوتيلا","ساخن",2.2],["دونات مشكل","3 حبات",1.5]]],["مشروبات","#cfe5bd",[["لاتيه مثلج","كوب كبير",1.4],["ماتشا لاتيه","بحليب",1.9],["عصير فراولة","طازج",1.3]]]],q={},cur=0,$=function(i){return document.getElementById(i)},mode=0;
function fl(){var a=[];C.forEach(function(c,i){c[2].forEach(function(x,j){a.push([i+"_"+j,x])})});return a}
function tabs(){$("tb").innerHTML=C.map(function(c,i){return"<button class='tab"+(i==cur?" on":"")+"' data-i='"+i+"'>"+c[0]+"</button>"}).join("");$("ls").innerHTML=C[cur][2].map(function(x,j){var k=cur+"_"+j;return"<div class='it'><div class='th' style='background:"+C[cur][1]+"'><svg width='34' height='34' viewBox='0 0 34 34'><circle cx='17' cy='17' r='14' fill='#fff' fill-opacity='.65'/><circle cx='17' cy='17' r='8' fill='none' stroke='#587a3d' stroke-width='2.4'/></svg></div><div><b>"+x[0]+"</b><span>"+x[1]+"</span><div class='pr'>"+x[2].toFixed(1)+" ر.ع</div></div><div class='qt'>"+(q[k]?"<button class='m' data-k='"+k+"' data-d='-1'>-</button><i>"+q[k]+"</i>":"")+"<button data-k='"+k+"' data-d='1'>+</button></div></div>"}).join("")}
function sum(){var n=0,t=0;fl().forEach(function(a){var c=q[a[0]]||0;n+=c;t+=c*a[1][2]});return[n,t]}
function upd(){var s=sum();$("ct").style.display=s[0]?"flex":"none";$("cc").textContent="عرض الطلب ("+s[0]+")";$("cp").textContent=s[1].toFixed(1)+" ر.ع"}
$("tb").onclick=function(e){var b=e.target.closest(".tab");if(b){cur=+b.dataset.i;tabs()}};
$("ls").onclick=function(e){var b=e.target.closest("button");if(!b)return;var k=b.dataset.k;q[k]=Math.max(0,(q[k]||0)+ +b.dataset.d);tabs();upd()};
$("ct").onclick=function(){var s=sum();$("cl").innerHTML=fl().filter(function(a){return q[a[0]]}).map(function(a){return"<div class='ln'><span>"+q[a[0]]+" × "+a[1][0]+"</span><span>"+(q[a[0]]*a[1][2]).toFixed(1)+"</span></div>"}).join("");$("tt").textContent=s[1].toFixed(1)+" ر.ع";$("m").style.display="none";$("ct").style.display="none";$("ck").style.display="block";scrollTo(0,0)};
$("md").onclick=function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call($("md").children,function(c,i){c.classList.remove("on");if(c===b)mode=i});b.classList.add("on")};
$("go").onclick=function(){var n=$("n").value.trim(),p=$("p").value.replace(/\D/g,""),e=$("e");e.style.display="none";if(n.length<2){e.textContent="اكتب اسمك";e.style.display="block";return}if(p.length<8){e.textContent="رقم الواتساب غير مكتمل";e.style.display="block";return}
var s=sum();$("tk").innerHTML="رقم الطلب: #"+(100+Math.floor(Math.random()*900))+"<br>"+n.replace(/</g,"")+"<br>"+(mode?"توصيل":"استلام من الفرع")+" · "+s[0]+" أصناف<br>الإجمالي: "+s[1].toFixed(1)+" ر.ع";$("ck").style.display="none";$("ok").style.display="block"};
tabs();
</script></body></html>
