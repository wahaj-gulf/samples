<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عينة توضيحية من فريق وهج</title>
<style>
:root{--p:#222;--a:#c9a97c;--pt:#fff;--bg:#faf7f2;--ink:#2a2a2a}
*{box-sizing:border-box;margin:0}body{font-family:Tahoma,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh}
.hero{background:var(--p);color:var(--pt);text-align:center;padding:42px 22px 44px;border-bottom:4px solid var(--a)}
.hero small{color:var(--a);letter-spacing:.3em;font-size:12px;display:block}.hero h1{font-size:30px;margin:10px 0 6px}
.hero .loc{color:var(--a);font-size:15px}.hero p{margin-top:14px;font-size:18px}.hero .sub{opacity:.8;font-size:14px;margin-top:8px}
.steps{display:flex;gap:8px;max-width:480px;margin:18px auto 0;padding:0 16px}.steps div{flex:1;background:#fff;border:1px solid #0001;border-radius:14px;padding:10px 6px;text-align:center;font-size:13px}
.steps b{display:block;color:var(--p);font-size:18px}
main{max-width:480px;margin:0 auto;padding:6px 16px 230px}
h2{font-size:16px;margin:22px 0 10px;color:var(--p);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid var(--p);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--p);color:var(--pt)}
.card{background:#fff;border:1px solid #0001;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card b{display:block;font-size:15px}.card span{font-size:12px;opacity:.65}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--p);background:#fff;color:var(--p);font-size:18px;cursor:pointer}
.qty i{min-width:16px;text-align:center;font-style:normal}
input{width:100%;padding:14px;border:1.5px solid #0002;border-radius:14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;margin:12px 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#b3261e;font-size:13px;display:none;margin-top:8px}
.note{margin-top:26px;text-align:center;font-size:12px;opacity:.65}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--p);padding:14px 16px 20px;border-top:2px solid var(--a);z-index:5}
.bar button{width:100%;max-width:480px;display:block;margin:0 auto;background:var(--a);color:#111;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.ok{display:none;text-align:center;padding:50px 22px}.ok .c{width:90px;height:90px;border-radius:50%;background:var(--p);margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--pt);font-size:46px}
.ok h3{font-size:26px;color:var(--p);margin:16px 0 6px}.sum{background:#fff;border:1.5px solid var(--a);border-radius:16px;padding:16px;margin:20px auto 0;max-width:420px;text-align:right;font-size:15px;line-height:2}
.feat{background:#fff;border:1px solid #0001;border-radius:16px;padding:14px;margin-bottom:10px}.feat b{color:var(--p)}
</style></head><body>
<section class="hero"><small id="en"></small><h1 id="nm"></h1><div class="loc" id="loc"></div><p id="hl"></p><div class="sub" id="sb"></div></section>
<div class="steps" id="st"></div>
<main id="f"></main>
<div class="ok" id="ok"><div class="c">&#10003;</div><h3 id="okh"></h3><p id="okp"></p><div class="sum" id="sum"></div><p class="note" id="okn"></p></div>
<div class="bar" id="bar"><button id="go"></button></div>
<script src="data.js"></script>
<script>
var D=window.D||{};
var K={
salon:{kind:"b",ch:["قص وتصفيف","صبغة","عناية بالبشرة","مكياج","مناكير وبديكير"],tag:"احجزي موعدك بدون اتصال",sub:"خدمات تجميل ونسائية بحجز سهل من الجوال"},
spa:{kind:"b",ch:["مساج استرخاء","جلسة عناية","حمام مغربي","باقة عروس"],tag:"احجزي جلسة الاسترخاء من جوالك",sub:"مواعيد واضحة وتأكيد سريع"},
barber:{kind:"b",ch:["قص شعر","حلاقة لحية","قص ولحية","عناية بالبشرة"],tag:"احجز دورك بدون انتظار",sub:"اختر الخدمة والوقت وتجي مباشرة"},
clinic:{kind:"b",ch:["كشف عام","استشارة","متابعة","فحص دوري"],tag:"احجز موعدك مع الطبيب",sub:"حجز مواعيد أونلاين وتأكيد عبر واتساب"},
dental:{kind:"b",ch:["كشف وفحص","تنظيف أسنان","تبييض","تقويم","حشو وعلاج"],tag:"احجز موعد الأسنان بدقيقة",sub:"اختر العلاج والوقت المناسب"},
gym:{kind:"b",ch:["اشتراك شهري","3 أشهر","سنوي","حصة تجريبية"],tag:"ابدأ اشتراكك من الجوال",sub:"اختر الباقة واحجز حصتك التجريبية"},
studio:{kind:"b",ch:["جلسة تصوير","تصوير منتجات","تصوير مناسبة","طباعة صور"],tag:"احجز جلسة التصوير",sub:"اختر نوع الجلسة والموعد"},
cafe:{kind:"o",cats:{"مشروبات ساخنة":["قهوة مختصة","كابتشينو","شاي كرك"],"مشروبات باردة":["آيس لاتيه","عصير طازج","سموذي"],"حلويات":["كيك اليوم","كوكيز","براونيز"]},tag:"اطلب من طاولتك أو من البيت",sub:"قائمة رقمية وطلب سريع"},
restaurant:{kind:"o",cats:{"الأطباق الرئيسية":["طبق اليوم","مشاوي مشكلة","أرز بالدجاج"],"المقبلات":["حمص","سلطة","شوربة"],"المشروبات":["عصير طازج","مشروب غازي","ماء"]},tag:"اطلب بدون انتظار",sub:"قائمة رقمية وطلب مباشر من الجوال"},
bakery:{kind:"o",cats:{"المخبوزات":["خبز طازج","كرواسون","معجنات"],"الكيك":["كيك شوكولاتة","تشيز كيك","كب كيك"],"طلبات خاصة":["كيكة مناسبة","علبة ضيافة"]},tag:"اطلب طلبك جاهز للاستلام",sub:"اطلب أونلاين واستلم بدون انتظار"},
sweets:{kind:"o",cats:{"الحلويات":["علبة مشكلة","حلوى عُمانية","شوكولاتة"],"الهدايا":["علبة هدية","طلب مناسبات"]},tag:"اطلب علبتك من الجوال",sub:"قائمة رقمية وطلب سريع"},
flowers:{kind:"o",cats:{"الباقات":["باقة ورد","بوكيه هدية","ورد طبيعي"],"المناسبات":["تنسيق حفل","هدية مع ورد"]},tag:"اطلب باقتك واختار وقت التوصيل",sub:"اطلب أونلاين بدون ما تتصل"},
shop:{kind:"l",tag:"متجرك على الجوال بشكل مرتب",sub:"صفحة تعرف الزبون بك وتوصله لواتساب بضغطة",feats:["منتجات واضحة بصور","طلب سريع عبر واتساب","عروض وتحديثات"]},
service:{kind:"l",tag:"خليهم يتعرفون عليك من أول نظرة",sub:"صفحة تعريفية وتواصل مباشر",feats:["خدمات واضحة","أعمال سابقة","تواصل سريع عبر واتساب"]}
};
var q=new URLSearchParams(location.search).get("l");
var d=D[q];
function lum(h){h=h.replace("#","");var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return(.299*r+.587*g+.114*b)/255}
function $(i){return document.getElementById(i)}
if(!d){document.body.innerHTML="<p style='padding:40px;text-align:center'>الرابط غير مكتمل</p>"}else{
var k=K[d.k]||K.service,r=document.documentElement.style;
r.setProperty("--p",d.c1);r.setProperty("--a",d.c2);r.setProperty("--pt",lum(d.c1)>.6?"#111":"#fff");
if(lum(d.c2)>.6){}
$("nm").textContent=d.n;$("en").textContent=d.e||"";$("loc").textContent=d.loc||"";$("hl").textContent=k.tag;$("sb").textContent=k.sub;
document.title=d.n+" | عينة من فريق وهج";
var sel={},cart={},F=$("f"),h="";
var S=k.kind=="b"?["اختاري الخدمة","حددي الموعد","نؤكد الحجز"]:k.kind=="o"?["اختر الأصناف","أرسل الطلب","نؤكد الطلب"]:["تعرّف علينا","اترك رقمك","نتواصل معك"];
$("st").innerHTML=S.map(function(s,i){return"<div><b>"+(i+1)+"</b>"+s+"</div>"}).join("");
function chips(id,arr){return"<div class='chips' id='"+id+"'>"+arr.map(function(x,i){return"<button class='chip"+(i==0?" on":"")+"'>"+x+"</button>"}).join("")+"</div>"}
var days=[];var dn=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];for(var i=1;i<=6;i++){var t=new Date(Date.now()+i*864e5);days.push(dn[t.getDay()]+" "+t.getDate()+"/"+(t.getMonth()+1))}
if(k.kind=="b"){h="<h2>الخدمة</h2>"+chips("c1",k.ch)+"<h2>اليوم</h2>"+chips("c2",days)+"<h2>الوقت</h2>"+chips("c3",["10:00 ص","12:00 م","4:00 م","6:00 م","8:00 م"])+"<label>الاسم</label><input id='n' placeholder='اسمك'><label>رقم الواتساب</label><input id='p' inputmode='tel' placeholder='9xxxxxxx'>"}
else if(k.kind=="o"){var c=Object.keys(k.cats);h="<h2>القائمة</h2>"+chips("c1",c)+"<div id='it' style='margin-top:14px'></div><label>الاسم</label><input id='n' placeholder='اسمك'><label>رقم الواتساب</label><input id='p' inputmode='tel' placeholder='9xxxxxxx'>"}
else{h="<h2>لماذا هذه الصفحة؟</h2>"+k.feats.map(function(x){return"<div class='feat'><b>"+x+"</b></div>"}).join("")+"<label>الاسم</label><input id='n' placeholder='اسمك'><label>رقم الواتساب</label><input id='p' inputmode='tel' placeholder='9xxxxxxx'>"}
F.innerHTML=h+"<div class='err' id='er'></div><p class='note'>عينة توضيحية من فريق وهج بهوية "+d.n+". الأصناف والأوقات أمثلة، ولا يتم إرسال أي بيانات.</p>";
$("go").textContent=k.kind=="b"?"احجز الآن":k.kind=="o"?"أرسل الطلب":"تواصل معنا";
function pick(id){var e=$(id);if(!e)return;e.onclick=function(ev){var b=ev.target.closest(".chip");if(!b)return;[].forEach.call(e.children,function(x){x.classList.remove("on")});b.classList.add("on");sel[id]=b.textContent;if(id=="c1"&&k.kind=="o")items(b.textContent)}}
function items(c){cart[c]=cart[c]||{};$("it").innerHTML=k.cats[c].map(function(x,i){return"<div class='card'><div><b>"+x+"</b><span>السعر حسب قائمتكم</span></div><div class='qty'><button data-i='"+i+"' data-d='-1'>-</button><i id='q"+i+"'>"+(cart[c][x]||0)+"</i><button data-i='"+i+"' data-d='1'>+</button></div></div>"}).join("");
$("it").onclick=function(ev){var b=ev.target.closest("button");if(!b)return;var x=k.cats[c][+b.dataset.i];cart[c][x]=Math.max(0,(cart[c][x]||0)+ +b.dataset.d);$("q"+b.dataset.i).textContent=cart[c][x]}}
pick("c1");pick("c2");pick("c3");
if(k.kind=="b"){sel.c1=k.ch[0];sel.c2=days[0];sel.c3="10:00 ص"}else if(k.kind=="o"){sel.c1=Object.keys(k.cats)[0];items(sel.c1)}
$("go").onclick=function(){var n=$("n").value.trim(),p=$("p").value.replace(/\D/g,""),e=$("er");e.style.display="none";
if(n.length<2){e.textContent="اكتب اسمك";e.style.display="block";return}if(p.length<8){e.textContent="رقم الواتساب غير مكتمل";e.style.display="block";return}
var s="";if(k.kind=="b"){s="الخدمة: "+sel.c1+"<br>الموعد: "+sel.c2+" · "+sel.c3}else if(k.kind=="o"){var L=[];Object.keys(cart).forEach(function(c){Object.keys(cart[c]).forEach(function(x){if(cart[c][x])L.push(x+" × "+cart[c][x])})});if(!L.length){e.textContent="اختر صنفًا واحدًا على الأقل";e.style.display="block";return}s=L.join("<br>")}else{s="سنتواصل معك على الواتساب"}
s+="<br>الاسم: "+n.replace(/</g,"");F.style.display="none";$("st").style.display="none";$("bar").style.display="none";$("ok").style.display="block";
$("okh").textContent=k.kind=="b"?"تم استلام حجزك":k.kind=="o"?"تم استلام طلبك":"وصلنا رسالتك";$("okp").textContent="هذا مثال لما يراه عميلك بعد الإرسال";$("sum").innerHTML=s;$("okn").textContent="عينة توضيحية من فريق وهج"}
}
</script></body></html>
