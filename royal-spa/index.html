<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Spa | حجز جلسة</title>
<style>@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}@font-face{font-family:'Cairo';font-style:normal;font-weight:400;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Cairo';font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.3.0/files/cairo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}@font-face{font-family:'Corm';font-style:normal;font-weight:600;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond@5.3.0/files/cormorant-garamond-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
.hf{font-family:"Corm","Cairo",serif}
:root{--pl:#16294a;--pk:#d4af6a;--cr:#f7f2e6;--ink:#17203a}
*{box-sizing:border-box;margin:0}body{font-family:"Cairo",Tahoma,system-ui,Arial,sans-serif;background:var(--cr);color:var(--ink);line-height:1.6}
.hero{position:relative;background:linear-gradient(160deg,#1d3563,#0f1d38);color:#fff;text-align:center;padding:46px 20px 70px;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%;opacity:.16}
.hero>*{position:relative}.gem{width:54px;height:54px;margin:0 auto 10px}
.hero small{letter-spacing:.45em;color:var(--pk);font-size:12px}.hero h1{font-size:32px;font-weight:400;letter-spacing:.08em;margin:6px 0}
.hero p{font-size:16px;opacity:.9}
.sheet{max-width:480px;margin:-38px auto 0;background:var(--cr);border-radius:28px 28px 0 0;padding:22px 18px 200px;position:relative}
h2{font-size:15px;color:var(--pl);margin:20px 0 10px}h2 b{display:inline-block;width:24px;height:24px;border-radius:50%;background:var(--pl);color:#fff;text-align:center;line-height:24px;font-size:13px;margin-left:8px}
.svc{display:grid;gap:10px}.sv{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid #e4d9bd;border-radius:18px;padding:14px;cursor:pointer;text-align:right;font:inherit;width:100%}
.sv i{width:44px;height:44px;border-radius:14px;background:#efe5c8;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;color:var(--pl)}
.sv b{display:block;font-size:15px}.sv span{font-size:12px;opacity:.6}.sv.on{border-color:var(--pl);background:#fbf4de;box-shadow:0 0 0 2px var(--pk) inset}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.d{flex:0 0 62px;background:#fff;border:1.5px solid #e4d9bd;border-radius:16px;padding:10px 0;text-align:center;font:inherit;cursor:pointer}
.d small{display:block;font-size:11px;opacity:.6}.d b{font-size:19px}.d.on{background:var(--pl);color:#fff;border-color:var(--pl)}
.tm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{background:#fff;border:1.5px solid #e4d9bd;border-radius:12px;padding:11px 0;font:inherit;font-size:14px;cursor:pointer}.t.on{background:var(--pk);border-color:var(--pk);color:#1a1405;font-weight:700}
input{width:100%;padding:14px;border:1.5px solid #d9ccaa;border-radius:14px;font:inherit;font-size:16px;background:#fff;margin-bottom:10px}
.err{color:#b3261e;font-size:13px;margin:4px 0;display:none}.note{text-align:center;font-size:12px;opacity:.6;margin-top:14px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px 20px;background:rgba(247,242,230,.96);border-top:1px solid #e4d9bd}
.bar button{display:block;width:100%;max-width:480px;margin:0 auto;border:0;border-radius:18px;background:var(--pl);color:#fff;padding:16px;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.ok{display:none;text-align:center;padding:60px 22px;max-width:480px;margin:0 auto}.ok svg{width:96px}.ok h3{font-size:26px;color:var(--pl);margin:14px 0 4px;font-weight:400}
.sum{margin:20px 0;background:#fff;border:1.5px solid var(--pk);border-radius:20px;padding:16px;text-align:right;line-height:2}
.hero h1,.ok h3{font-family:"Corm","Cairo",serif;font-weight:600;font-size:44px;letter-spacing:.06em}.hero small{font-family:"Cairo"}.hero{border-radius:0 0 50% 50%/0 0 34px 34px;border-bottom:3px solid #d4af6a;padding-bottom:84px}
.svc{grid-template-columns:1fr 1fr}.sv{flex-direction:column;text-align:center;padding:16px 8px}.sv i{width:48px;height:48px;border-radius:50%}
.sv:last-child{grid-column:1/3}.d{border-radius:50px 50px 14px 14px}.t{border-radius:99px}.sheet{border-radius:0;margin-top:-30px}</style></head><body>
<section class="hero"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#fff" stroke-width="1"><path d="M0 40L60 0L120 40L180 0L240 40L300 0L360 40L420 0M0 100L60 60L120 100L180 60L240 100L300 60L360 100L420 60M0 160L60 120L120 160L180 120L240 160L300 120L360 160L420 120M0 220L60 180L120 220L180 180L240 220L300 180L360 220L420 180M0 280L60 240L120 280L180 240L240 280L300 240L360 280L420 240"/></g></svg>
<svg class="gem" style="position:static;opacity:1;width:54px;height:54px" viewBox="0 0 60 60"><path d="M8 44L12 18L24 32L30 14L36 32L48 18L52 44Z" fill="none" stroke="#d4af6a" stroke-width="2.4" stroke-linejoin="round"/><path d="M10 50H50" stroke="#d4af6a" stroke-width="2.4"/></svg>
<small>ROYAL SPA</small><h1>Royal Spa</h1><p>احجزي جلستك الملكية من جوالك</p></section>
<main class="sheet" id="f">
<h2><b>1</b>اختاري جلستك</h2><div class="svc" id="s"></div>
<h2><b>2</b>اليوم</h2><div class="days" id="d"></div>
<h2><b>3</b>الوقت</h2><div class="tm" id="t"></div>
<h2><b>4</b>بياناتك</h2><input id="n" placeholder="الاسم"><input id="p" inputmode="tel" placeholder="رقم الواتساب"><div class="err" id="e"></div>
<p class="note">عينة توضيحية من فريق وهج بهوية Royal Spa. الجلسات والأوقات أمثلة، ولا يتم إرسال أي بيانات.</p></main>
<div class="ok" id="ok"><svg viewBox="0 0 60 60"><path d="M8 44L12 18L24 32L30 14L36 32L48 18L52 44Z" fill="#d4af6a" stroke="#16294a" stroke-width="2"/><path d="M22 28l6 6 11-12" fill="none" stroke="#16294a" stroke-width="3.4"/></svg><h3>تم استلام حجزك</h3><p>هذا مثال لما تشوفه عميلتك بعد الحجز</p><div class="sum" id="sm"></div><p class="note">عينة توضيحية من فريق وهج</p></div>
<div class="bar" id="b"><button id="go">أكّدي الحجز</button></div>
<script>
var S=[["مساج استرخاء","60 دقيقة","&#9679;"],["مساج بالأحجار الدافئة","75 دقيقة","&#9670;"],["جلسة عناية بالوجه","45 دقيقة","&#9830;"],["حمام مغربي","50 دقيقة","&#10022;"],["باقة العروس","3 ساعات","&#9733;"]],sel=[0,0,"10:00 ص"];
var dn=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],$=function(i){return document.getElementById(i)};
$("s").innerHTML=S.map(function(x,i){return"<button class='sv"+(i?"":" on")+"' data-i='"+i+"'><i>"+x[2]+"</i><div><b>"+x[0]+"</b><span>"+x[1]+" · السعر حسب قائمتكم</span></div></button>"}).join("");
var D=[];for(var i=1;i<=7;i++){var t=new Date(Date.now()+i*864e5);D.push(dn[t.getDay()]+" "+t.getDate()+"/"+(t.getMonth()+1));}
$("d").innerHTML=D.map(function(x,i){var p=x.split(" ");return"<button class='d"+(i?"":" on")+"' data-i='"+i+"'><small>"+p[0]+"</small><b>"+p[1].split("/")[0]+"</b></button>"}).join("");
var T=["10:00 ص","11:30 ص","1:00 م","3:00 م","4:30 م","6:00 م"];$("t").innerHTML=T.map(function(x,i){return"<button class='t"+(i?"":" on")+"'>"+x+"</button>"}).join("");
function grp(id,cls,fn){$(id).onclick=function(e){var b=e.target.closest("."+cls);if(!b)return;[].forEach.call($(id).children,function(c){c.classList.remove("on")});b.classList.add("on");fn(b)}}
grp("s","sv",function(b){sel[0]=+b.dataset.i});grp("d","d",function(b){sel[1]=+b.dataset.i});grp("t","t",function(b){sel[2]=b.textContent});
$("go").onclick=function(){var n=$("n").value.trim(),p=$("p").value.replace(/\D/g,""),e=$("e");e.style.display="none";if(n.length<2){e.textContent="اكتبي اسمك";e.style.display="block";return}if(p.length<8){e.textContent="رقم الواتساب غير مكتمل";e.style.display="block";return}
$("sm").innerHTML=S[sel[0]][0]+"<br>"+D[sel[1]]+" · "+sel[2]+"<br>الاسم: "+n.replace(/</g,"");$("f").style.display="none";$("b").style.display="none";document.querySelector(".hero").style.display="none";$("ok").style.display="block"};
</script></body></html>
